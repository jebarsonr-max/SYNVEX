version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - SECRET_KEY=synvex-super-secure-production-ready-jwt-secret-key-32chars
      - DATABASE_URL=sqlite:///./synvex.db
      - MAX_UPLOAD_SIZE_MB=25
      - CORS_ORIGINS=["http://localhost:5173", "http://localhost:3000", "http://localhost:80"]
    volumes:
      - synvex_data:/app/uploads
      - synvex_db:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  synvex_data:
  synvex_db:
